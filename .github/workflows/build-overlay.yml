name: Build Overlay
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          script: echo "sdk installed"

      - name: Install build-tools
        run: yes | sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Build overlay with aapt2
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          PLAT="$ANDROID_SDK_ROOT/platforms/android-34/android.jar"
          mkdir -p out/flat
          "$BT/aapt2" compile -o out/flat --dir res
          "$BT/aapt2" link -o out/treble-overlay-samsung-a155m-unsigned.apk \
            --manifest AndroidManifest.xml -I "$PLAT" out/flat/*.flata
          "$BT/zipalign" -p -f 4 out/treble-overlay-samsung-a155m-unsigned.apk out/treble-overlay-samsung-a155m-aligned.apk
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          "$BT/apksigner" sign --ks debug.keystore --ks-pass pass:android out/treble-overlay-samsung-a155m-aligned.apk
          mv out/treble-overlay-samsung-a155m-aligned.apk treble-overlay-samsung-a155m.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: treble-overlay-samsung-a155m
          path: treble-overlay-samsung-a155m.apk
